org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
# binary-compatibility-validator 가 kotlin-android 플러그인을 요구해 AGP 9 의 내장 Kotlin 을 끈다
android.builtInKotlin=false
android.newDsl=false

# 배포 좌표 — 모듈별 artifactId 는 각 build.gradle.kts 의 coordinates 가 정한다
GROUP=net.plumt.image

POM_URL=https://github.com/plumt/sdk-kotlin-image
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/plumt/sdk-kotlin-image
POM_SCM_CONNECTION=scm:git:git://github.com/plumt/sdk-kotlin-image.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/plumt/sdk-kotlin-image.git
POM_DEVELOPER_ID=plumt
POM_DEVELOPER_NAME=plumt
POM_DEVELOPER_URL=https://plumt.net
